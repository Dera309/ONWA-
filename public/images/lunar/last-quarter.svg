<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="lq-halo" cx="35%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#C5A880" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lq-dark-side" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181e" />
      <stop offset="70%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <radialGradient id="lq-gold-surf" cx="30%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFF5DB" />
      <stop offset="25%" stop-color="#E5C378" />
      <stop offset="60%" stop-color="#C5A880" />
      <stop offset="90%" stop-color="#8C6F42" />
      <stop offset="100%" stop-color="#4A3B22" />
    </radialGradient>
    <clipPath id="lq-moon-clip">
      <circle cx="120" cy="120" r="90" />
    </clipPath>
  </defs>

  <circle cx="120" cy="120" r="115" fill="url(#lq-halo)" />

  <g clip-path="url(#lq-moon-clip)">
    <!-- Dark side -->
    <circle cx="120" cy="120" r="90" fill="url(#lq-dark-side)" />
    <ellipse cx="160" cy="90" rx="18" ry="14" fill="#09090c" opacity="0.6" />
    <ellipse cx="145" cy="140" rx="22" ry="16" fill="#09090c" opacity="0.7" />

    <!-- Illuminated left half (Last Quarter) -->
    <path d="M 120 30 A 90 90 0 0 0 120 210 Z" fill="url(#lq-gold-surf)" />

    <!-- Craters along the terminator -->
    <circle cx="114" cy="65" r="5" fill="#4A3B22" opacity="0.6" />
    <circle cx="113" cy="65" r="4" fill="#E5C378" opacity="0.5" />
    <circle cx="108" cy="100" r="7" fill="#5A472A" opacity="0.7" />
    <circle cx="107" cy="100" r="5" fill="#FFF5DB" opacity="0.4" />
    <circle cx="112" cy="145" r="6" fill="#4A3B22" opacity="0.6" />
    <circle cx="111" cy="145" r="4.5" fill="#E5C378" opacity="0.5" />
    <circle cx="116" cy="175" r="4" fill="#4A3B22" opacity="0.6" />
  </g>

  <circle cx="120" cy="120" r="90" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.4" />
</svg>
