<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="nm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#D4AF37" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Moon sphere dark metallic gradient -->
    <radialGradient id="nm-sphere" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="85%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <!-- Rim light gradient -->
    <linearGradient id="nm-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#C5A880" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#8c7853" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <!-- Crater shadow -->
    <radialGradient id="nm-crater" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#141418" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Halo -->
  <circle cx="120" cy="120" r="110" fill="url(#nm-halo)" />

  <!-- Moon Body -->
  <circle cx="120" cy="120" r="90" fill="url(#nm-sphere)" stroke="url(#nm-rim)" stroke-width="1.5" />

  <!-- Lunar Maria / Crater Details (Dark ethereal topography) -->
  <ellipse cx="95" cy="85" rx="22" ry="16" fill="url(#nm-crater)" />
  <ellipse cx="140" cy="100" rx="28" ry="20" fill="url(#nm-crater)" opacity="0.7" />
  <ellipse cx="110" cy="145" rx="32" ry="18" fill="url(#nm-crater)" opacity="0.85" />
  <circle cx="80" cy="130" r="10" fill="#0d0d10" opacity="0.7" />
  <circle cx="150" cy="140" r="8" fill="#0e0e12" opacity="0.6" />
  <circle cx="130" cy="70" r="6" fill="#141419" opacity="0.7" />

  <!-- Micro gold stars / Stardust around New Moon -->
  <circle cx="45" cy="75" r="1" fill="#D4AF37" opacity="0.6" />
  <circle cx="195" cy="65" r="1" fill="#C5A880" opacity="0.5" />
  <circle cx="180" cy="175" r="1" fill="#D4AF37" opacity="0.7" />
  <circle cx="55" cy="165" r="1" fill="#C5A880" opacity="0.4" />
  <circle cx="120" cy="20" r="1.5" fill="#D4AF37" opacity="0.5" />

  <!-- Faint top-left crescent edge glow for the seed of rebirth -->
  <path d="M 120 31 A 89 89 0 0 1 209 120 A 89 89 0 0 0 135 45 Z" fill="#D4AF37" opacity="0.12" />
</svg>
