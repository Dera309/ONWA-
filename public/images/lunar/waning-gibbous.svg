<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="wng-halo" cx="40%" cy="50%" r="50%">
      <stop offset="35%" stop-color="#D4AF37" stop-opacity="0.32" />
      <stop offset="75%" stop-color="#C5A880" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wng-dark-side" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181e" />
      <stop offset="70%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>
    <radialGradient id="wng-gold-surf" cx="40%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFF5DB" />
      <stop offset="25%" stop-color="#E5C378" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#8C6F42" />
      <stop offset="100%" stop-color="#4A3B22" />
    </radialGradient>
    <clipPath id="wng-moon-clip">
      <circle cx="120" cy="120" r="90" />
    </clipPath>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#wng-halo)" />

  <g clip-path="url(#wng-moon-clip)">
    <!-- Dark side -->
    <circle cx="120" cy="120" r="90" fill="url(#wng-dark-side)" />

    <!-- Waning Gibbous: mostly illuminated, dark crescent sliver on right -->
    <path d="M 120 30 A 90 90 0 0 0 30 120 A 90 90 0 0 0 120 210 A 108 90 0 0 0 120 30 Z" fill="url(#wng-gold-surf)" />
    <path d="M 120 30 A 90 90 0 0 0 120 210 Z" fill="url(#wng-gold-surf)" />
    <path d="M 120 30 A 45 90 0 0 1 120 210 A 90 90 0 0 0 120 30 Z" fill="url(#wng-gold-surf)" />

    <!-- Craters -->
    <circle cx="155" cy="85" r="5" fill="#4A3B22" opacity="0.6" />
    <circle cx="154" cy="85" r="4" fill="#E5C378" opacity="0.5" />
    <circle cx="145" cy="125" r="7" fill="#5A472A" opacity="0.7" />
    <circle cx="100" cy="110" r="8" fill="#5A472A" opacity="0.5" />
    <circle cx="80" cy="140" r="6" fill="#4A3B22" opacity="0.5" />
  </g>

  <circle cx="120" cy="120" r="90" fill="none" stroke="#D4AF37" stroke-width="1.3" stroke-opacity="0.5" />
</svg>
