<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background glow on illuminated left side -->
    <radialGradient id="wan-halo" cx="30%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Dark unilluminated sphere -->
    <radialGradient id="wan-dark-side" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181e" />
      <stop offset="70%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#060608" />
    </radialGradient>

    <!-- Golden illuminated crescent surface (left side) -->
    <radialGradient id="wan-gold-surf" cx="22%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF5DB" />
      <stop offset="25%" stop-color="#E5C378" />
      <stop offset="60%" stop-color="#C5A880" />
      <stop offset="90%" stop-color="#8C6F42" />
      <stop offset="100%" stop-color="#4A3B22" />
    </radialGradient>

    <clipPath id="wan-moon-clip">
      <circle cx="120" cy="120" r="90" />
    </clipPath>
  </defs>

  <!-- Ambient Outer Golden Glow -->
  <circle cx="120" cy="120" r="115" fill="url(#wan-halo)" />

  <!-- Moon Body Group with Clipping -->
  <g clip-path="url(#wan-moon-clip)">
    <!-- 1. Dark side of the moon -->
    <circle cx="120" cy="120" r="90" fill="url(#wan-dark-side)" />

    <!-- 2. Dark side faint maria / crater details -->
    <ellipse cx="160" cy="90" rx="18" ry="14" fill="#09090c" opacity="0.6" />
    <ellipse cx="145" cy="140" rx="22" ry="16" fill="#09090c" opacity="0.7" />
    <circle cx="170" cy="130" r="8" fill="#0b0b0e" opacity="0.5" />

    <!-- 3. Glowing Golden Crescent (Waning - left side) -->
    <path d="M 120 30 A 90 90 0 0 0 30 120 A 90 90 0 0 0 120 210 A 108 90 0 0 1 120 30 Z" fill="url(#wan-gold-surf)" />

    <!-- 4. Crescent Craters along the Terminator line -->
    <circle cx="88" cy="70" r="4.5" fill="#4A3B22" opacity="0.6" />
    <circle cx="87" cy="70" r="3.5" fill="#E5C378" opacity="0.5" />

    <circle cx="72" cy="100" r="6" fill="#5A472A" opacity="0.7" />
    <circle cx="71" cy="100" r="4.5" fill="#FFF5DB" opacity="0.4" />

    <circle cx="75" cy="135" r="5" fill="#4A3B22" opacity="0.6" />
    <circle cx="74" cy="135" r="4" fill="#E5C378" opacity="0.5" />

    <circle cx="95" cy="165" r="4" fill="#4A3B22" opacity="0.6" />
    <circle cx="94" cy="165" r="3" fill="#E5C378" opacity="0.5" />
  </g>

  <!-- Thin Outer Silhouette Ring -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.3" />
</svg>
