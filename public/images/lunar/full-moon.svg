<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Radiant full outer halo -->
    <radialGradient id="fm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#C5A880" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Full Moon sphere 3D radiant surface -->
    <radialGradient id="fm-surf" cx="44%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="20%" stop-color="#F2DFB3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B89348" />
      <stop offset="100%" stop-color="#6E5224" />
    </radialGradient>

    <!-- Lunar Maria (Dark plains on full moon - Sea of Tranquility, etc.) -->
    <radialGradient id="fm-maria" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7A5E2E" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#543F1C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3D2D12" stop-opacity="0.95" />
    </radialGradient>

    <!-- Crater highlight -->
    <radialGradient id="fm-crater-high" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.3" />
    </radialGradient>

    <clipPath id="fm-clip">
      <circle cx="120" cy="120" r="90" />
    </clipPath>
  </defs>

  <!-- Radiant Celestial Halo -->
  <circle cx="120" cy="120" r="118" fill="url(#fm-halo)" />

  <!-- Moon Body with Clip -->
  <g clip-path="url(#fm-clip)">
    <!-- Base Illuminated Sphere -->
    <circle cx="120" cy="120" r="90" fill="url(#fm-surf)" />

    <!-- Major Lunar Maria (Cosmic Seas) -->
    <!-- Oceanus Procellarum (top left) -->
    <path d="M 65 70 Q 80 50 105 60 Q 115 80 90 100 Q 60 95 65 70 Z" fill="url(#fm-maria)" />
    <!-- Mare Imbrium (mid-upper) -->
    <circle cx="105" cy="85" r="18" fill="url(#fm-maria)" opacity="0.9" />
    <!-- Mare Serenitatis & Tranquillitatis (center right) -->
    <ellipse cx="140" cy="95" rx="16" ry="14" fill="url(#fm-maria)" opacity="0.88" />
    <ellipse cx="152" cy="118" rx="18" ry="15" fill="url(#fm-maria)" opacity="0.85" />
    <!-- Mare Nubium (lower left) -->
    <ellipse cx="100" cy="138" rx="20" ry="14" fill="url(#fm-maria)" opacity="0.9" />
    <!-- Mare Fecunditatis & Nectaris (lower right) -->
    <ellipse cx="150" cy="148" rx="14" ry="12" fill="url(#fm-maria)" opacity="0.8" />

    <!-- Tycho Crater & Famous Ray System (Bottom) -->
    <circle cx="115" cy="168" r="6" fill="#FFFDF5" />
    <!-- Tycho Ray streams -->
    <path d="M 115 168 L 70 120" stroke="#FFFDF5" stroke-width="0.75" stroke-opacity="0.5" />
    <path d="M 115 168 L 155 125" stroke="#FFFDF5" stroke-width="0.75" stroke-opacity="0.5" />
    <path d="M 115 168 L 110 90" stroke="#FFFDF5" stroke-width="0.75" stroke-opacity="0.4" />
    <path d="M 115 168 L 175 160" stroke="#FFFDF5" stroke-width="0.75" stroke-opacity="0.5" />
    <path d="M 115 168 L 60 160" stroke="#FFFDF5" stroke-width="0.75" stroke-opacity="0.5" />

    <!-- Copernicus Crater (Bright center-left beacon) -->
    <circle cx="88" cy="108" r="5" fill="#FFFDF5" opacity="0.95" />
    <circle cx="88" cy="108" r="7" fill="none" stroke="#543F1C" stroke-width="1.2" opacity="0.7" />

    <!-- Kepler Crater -->
    <circle cx="68" cy="105" r="3" fill="#FFFDF5" opacity="0.9" />

    <!-- Aristarchus Crater (Extra Bright) -->
    <circle cx="65" cy="85" r="2.5" fill="#FFFFFF" />

    <!-- Limb / Edge Atmosphere Glow -->
    <circle cx="120" cy="120" r="89" fill="none" stroke="#FFF8E7" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Luminous Edge Ring -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.7" />
</svg>
